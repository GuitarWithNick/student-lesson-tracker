name: Supabase Keepalive

on:
  schedule:
    # Three small database reads per day. GitHub cron uses UTC.
    - cron: "17 7,15,23 * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Query tracker_state
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send Supabase database activity
        env:
          SUPABASE_URL: https://aykzrmuyfncrwftfgnnd.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_FqHiov5VENtMFIpN9hJgNQ_34tpszLw
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            "${SUPABASE_URL}/rest/v1/tracker_state?select=studio_id&studio_id=eq.GuitarWithNick&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            -o /dev/null

          echo "Supabase keepalive database query completed."
